<ion-tab-bar slot="bottom" class="sep-tab-bar" data-testid="sep-tab-bar">
  @for (tab of tabs(); track tab.tab) {
    <ion-tab-button
      [class.tab-selected]="estaAtiva(tab)"
      (click)="irPara(tab.href)"
      [attr.data-testid]="'sep-tab-' + tab.tab"
    >
      <ion-icon [name]="tab.icon" aria-hidden="true" />
      <ion-label>{{ tab.label }}</ion-label>
    </ion-tab-button>
  }
</ion-tab-bar>
