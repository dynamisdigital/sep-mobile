<sep-header-mobile />
<ion-content class="sep-home">
  <section class="sep-home-section">
    <header class="sep-home-greeting">
      <p class="sep-home-greeting-label">Ola</p>
      <h1 class="sep-home-greeting-name" data-testid="sep-home-email">{{ user()?.username }}</h1>
    </header>
    <div class="sep-home-shortcuts">
      @for (shortcut of shortcuts(); track shortcut.link) {
        <a class="sep-home-card" [routerLink]="shortcut.link" [attr.data-testid]="shortcut.testid">
          <span class="sep-home-card-chip" [style.--chip-tone]="shortcut.tone" aria-hidden="true">
            <ion-icon [name]="shortcut.icon"></ion-icon>
          </span>
          <span class="sep-home-card-text">
            <span class="sep-home-card-label">{{ shortcut.label }}</span>
            <span class="sep-home-card-description">{{ shortcut.description }}</span>
          </span>
        </a>
      }
    </div>
  </section>
</ion-content>
