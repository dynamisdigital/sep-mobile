<sep-header-mobile />
<ion-content class="sep-change-password">
  <section class="sep-change-password-section">
    <header class="sep-change-password-header">
      <h1 class="sep-change-password-title">Alterar senha</h1>
      <p class="sep-change-password-subtitle">Senha com exatos 6 caracteres.</p>
    </header>

    <form
      class="sep-change-password-form"
      [formGroup]="form"
      novalidate
      (ngSubmit)="submit()"
      data-testid="sep-change-password-form"
    >
      <label class="sep-change-password-field">
        <span class="sep-change-password-label">Senha atual</span>
        <input
          type="password"
          formControlName="passwordAtual"
          autocomplete="current-password"
          minlength="6"
          maxlength="6"
          data-testid="sep-change-password-atual"
        />
        @if (
          form.controls.passwordAtual.touched && form.controls.passwordAtual.hasError('required')
        ) {
          <span class="sep-change-password-error" role="alert">Informe a senha atual.</span>
        }
      </label>

      <label class="sep-change-password-field">
        <span class="sep-change-password-label">Nova senha</span>
        <input
          type="password"
          formControlName="novaSenha"
          autocomplete="new-password"
          minlength="6"
          maxlength="6"
          data-testid="sep-change-password-nova"
        />
        @if (
          form.controls.novaSenha.touched &&
          (form.controls.novaSenha.hasError('required') ||
            form.controls.novaSenha.hasError('minlength') ||
            form.controls.novaSenha.hasError('maxlength'))
        ) {
          <span class="sep-change-password-error" role="alert"
            >A nova senha precisa ter 6 caracteres.</span
          >
        }
      </label>

      <label class="sep-change-password-field">
        <span class="sep-change-password-label">Confirmar nova senha</span>
        <input
          type="password"
          formControlName="confirmacaoNovaSenha"
          autocomplete="new-password"
          minlength="6"
          maxlength="6"
          data-testid="sep-change-password-confirmacao"
        />
        @if (form.controls.confirmacaoNovaSenha.touched && form.hasError('confirmacaoDiferente')) {
          <span class="sep-change-password-error" role="alert"
            >A confirmacao precisa ser igual a nova senha.</span
          >
        }
      </label>

      @if (errorMessage(); as msg) {
        <p
          class="sep-change-password-banner sep-change-password-banner--error"
          role="alert"
          data-testid="sep-change-password-error"
        >
          {{ msg }}
        </p>
      }
      @if (successMessage(); as msg) {
        <p
          class="sep-change-password-banner sep-change-password-banner--success"
          role="status"
          data-testid="sep-change-password-success"
        >
          {{ msg }}
        </p>
      }

      <div class="sep-change-password-actions">
        <button
          type="submit"
          class="sep-change-password-button sep-change-password-button--primary"
          [disabled]="submitting()"
          data-testid="sep-change-password-submit"
        >
          @if (submitting()) {
            <span>Salvando...</span>
          } @else {
            <span>Salvar nova senha</span>
          }
        </button>
        <a
          class="sep-change-password-button sep-change-password-button--ghost"
          routerLink="/app/perfil"
          data-testid="sep-change-password-cancel"
        >
          Voltar para o perfil
        </a>
      </div>
    </form>
  </section>
</ion-content>
