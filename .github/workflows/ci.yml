# =============================================================================
# CI do repositorio sep-mobile (Ionic 8 + Angular 20 + Capacitor 8 — PWA-first).
# Copiado de docs-SEP/docs-sep/ci-pipelines/templates/sep-mobile-pwa-ci.template.yml
# Ajustes locais:
#   - name renomeado para CI-MOBILE (diferencia de CI-API e CI-APP nos required checks)
#   - npm ci com --legacy-peer-deps (vitest@^2 vs peer optional vitest@^3.1.1 do
#     @angular/build, @testing-library/angular@18.1.1 vs Angular 20 transitive)
#   - adicionados format:check, lint:scss e build PWA com upload de coverage
#   - concurrency cancel-in-progress + timeout 15 min
# =============================================================================

name: CI-MOBILE

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    # Roda em push de qualquer branch (feature/*, fix/*, hotfix/*, etc.) pra
    # garantir test+lint+build PWA antes de PR. Branches com PR aberto
    # rodarao 2 vezes (push + pull_request); tolerado em favor de validacao
    # continua (alinhado a sep-api/sep-app).
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, Lint, Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Format check
        run: npm run format:check

      # D-Sprint 1: falha o job em `high`/`critical`. Limiar high, e nao `total`, porque
      # `moderate`/`low` aqui so tem correcao em major de Angular/Capacitor — barrado pelos
      # ADR 0018 e 0019 — e gate cronicamente vermelho vira gate ignorado.
      # Vai SO neste job: `build` e `android` instalam do mesmo lock, entao repetir triplicaria o
      # tempo sem cobrir nada a mais.
      - name: Security audit (dependencias, falha em high/critical)
        run: npm run audit

      - name: Lint TS/HTML
        run: npm run lint

      - name: Lint SCSS
        run: npm run lint:scss

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build PWA
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build PWA
        run: |
          npm run build
          test -d www

      - name: Upload PWA artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pwa-www
          path: www/
          if-no-files-found: error
          retention-days: 14

  android:
    # Build nativo Android (M-Sprint 13). Node 22 obrigatorio: o Capacitor
    # CLI 8 aborta com Node < 22 (ADR 0019). Sem assinatura nem keystore —
    # apenas assembleDebug prova que o projeto android/ compila reproduzivel.
    name: Build Android (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web + sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Gradle unit tests + lint
        run: |
          cd android
          ./gradlew test lint --console=plain

      - name: Assemble debug APK
        run: |
          cd android
          ./gradlew assembleDebug --console=plain
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
