# Configuracao do Dependabot para o sep-mobile.
# Estrategia: agrupar amplamente para reduzir o numero de PRs (de ~1 por dep
# para no maximo ~5 por ciclo), com limite baixo e ignore de transitivos de DEV
# sem fix. Ordem dos grupos importa: cada dependencia entra no PRIMEIRO grupo
# cujo pattern casa.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      # Pacotes Angular sobem em conjunto (sync de versao), SO minor/patch.
      # Majors (ex: Angular 20 -> 22) sao migracao manual via `ng update` e
      # estao no ignore abaixo — Dependabot nao deve propor.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@angular-eslint/*'
          - 'angular-eslint'
        update-types:
          - 'minor'
          - 'patch'
      # Stack de teste/bundler: vitest e @vitest/coverage-v8 precisam da MESMA
      # versao; vite/@analogjs acompanham.
      test-tooling:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vite'
          - '@analogjs/*'
      # Catch-all de baixo risco: tudo que nao for Angular/test-tooling, em UMA
      # PR de minor + patch.
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      # Sem grupo de majors: o Dependabot nao abre PRs de major automaticamente.
      # Majors (Angular, TypeScript, @eslint/js, stylelint, @testing-library/angular,
      # ionicons, ...) sao migracao manual deliberada (`ng update`/bump assistido),
      # pois quebram a stack Angular 20 atual (CI Node 20, TS ~5.9, vitest/analog 3.x).
      # Os ignore abaixo reforcam por dependencia o que ja era politica.
    ignore:
      # Transitivos apenas de toolchain de DEV, sem fix resolvivel upstream e
      # fora do bundle de producao (build usa esbuild, nao webpack-dev-server):
      # - uuid:        build-angular -> webpack-dev-server -> sockjs -> uuid
      # - shell-quote: build-angular -> webpack-dev-server -> launch-editor -> shell-quote
      # - hono:        @angular/cli -> @modelcontextprotocol/sdk -> @hono/node-server -> hono
      - dependency-name: 'uuid'
      - dependency-name: 'shell-quote'
      - dependency-name: 'hono'
      # Majors de vitest/@analogjs nao sao aplicaveis no Angular 20: analogjs 2.x
      # exige @angular/build/private (Angular 21+) e quebra o vitest.config.
      # Manter na serie 3.x ate uma futura migracao de Angular.
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@analogjs/*'
        update-types:
          - 'version-update:semver-major'
      # Majors do Angular (20 -> 21/22...) exigem `ng update` + Node 22+ e
      # quebram a stack atual (CI Node 20, vitest/analog fixados no Angular 20).
      # Fazer como migracao deliberada, nunca por bump automatico.
      - dependency-name: '@angular/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@angular-devkit/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@angular-eslint/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'angular-eslint'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
